<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRMS Dashboard - Live Google Sheets</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col justify-between p-4 shadow-lg">
      <div>
        <div class="flex items-center gap-3 text-xl font-bold text-blue-400 mb-8 p-2 border-b border-slate-700 pb-4">
          <i class="fa-solid fa-users-gear text-2xl"></i>
          <span>Company HRMS</span>
        </div>
        
        <!-- Navigation Buttons -->
        <nav class="space-y-3">
          <button onclick="showSheet('hr')" id="btnHR" class="w-full text-left flex items-center gap-3 p-3 rounded-xl bg-blue-600 text-white font-medium shadow transition-all duration-200">
            <i class="fa-solid fa-id-card text-lg"></i> HR Sheet
          </button>
          
          <button onclick="showSheet('ops')" id="btnOps" class="w-full text-left flex items-center gap-3 p-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium transition-all duration-200">
            <i class="fa-solid fa-gears text-lg"></i> Operations Sheet
          </button>
        </nav>
      </div>

      <div class="text-xs text-slate-400 text-center border-t border-slate-800 pt-4">
        <p class="flex items-center justify-center gap-1">
          <i class="fa-solid fa-sync text-green-400 animate-spin"></i> Live Google Sheets Sync
        </p>
        <p class="mt-1">&copy; 2026 HRMS System</p>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col overflow-hidden bg-gray-50">
      
      <!-- Top Header -->
      <div class="bg-white border-b border-gray-200 px-8 py-4 flex justify-between items-center shadow-sm">
        <div>
          <h1 id="tabTitle" class="text-2xl font-bold text-gray-800">HR Directory & Data</h1>
          <p class="text-gray-500 text-sm">Google Sheets se live data view karein.</p>
        </div>
        <div class="flex items-center gap-3">
          <button onclick="reloadIframes()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition">
            <i class="fa-solid fa-rotate-right"></i> Refresh Sheet
          </button>
        </div>
      </div>

      <!-- Sheet Display Container -->
      <div class="flex-1 p-6 overflow-hidden">
        <div class="w-full h-full bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden">
          
          <!-- HR Sheet Frame -->
          <iframe id="frameHR" 
            src="https://docs.google.com/spreadsheets/d/e/2PACX-1vR6DAT9uKgT8hruMlMEhJZE2X0O2Rm0g1YqkrkOXv0KSGkwdFqzAK5jRdxpDlvS_xQmwsf5EVTqC3Z-/pubhtml?gid=622384515&amp;single=true&amp;widget=true&amp;headers=false" 
            class="w-full h-full border-0">
          </iframe>

          <!-- Operations Sheet Frame -->
          <iframe id="frameOps" 
            src="https://docs.google.com/spreadsheets/d/e/2PACX-1vR6DAT9uKgT8hruMlMEhJZE2X0O2Rm0g1YqkrkOXv0KSGkwdFqzAK5jRdxpDlvS_xQmwsf5EVTqC3Z-/pubhtml?gid=0&amp;single=true&amp;widget=true&amp;headers=false" 
            class="w-full h-full border-0 hidden">
          </iframe>

        </div>
      </div>

    </main>
  </div>

  <!-- JavaScript for Switching Tabs -->
  <script>
    function showSheet(sheetType) {
      const frameHR = document.getElementById('frameHR');
      const frameOps = document.getElementById('frameOps');
      const btnHR = document.getElementById('btnHR');
      const btnOps = document.getElementById('btnOps');
      const tabTitle = document.getElementById('tabTitle');

      if (sheetType === 'hr') {
        frameHR.classList.remove('hidden');
        frameOps.classList.add('hidden');
        
        btnHR.className = "w-full text-left flex items-center gap-3 p-3 rounded-xl bg-blue-600 text-white font-medium shadow transition-all duration-200";
        btnOps.className = "w-full text-left flex items-center gap-3 p-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium transition-all duration-200";
        
        tabTitle.textContent = "HR Directory & Data";
      } else {
        frameHR.classList.add('hidden');
        frameOps.classList.remove('hidden');

        btnOps.className = "w-full text-left flex items-center gap-3 p-3 rounded-xl bg-blue-600 text-white font-medium shadow transition-all duration-200";
        btnHR.className = "w-full text-left flex items-center gap-3 p-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium transition-all duration-200";

        tabTitle.textContent = "Operations Sheet Data";
      }
    }

    function reloadIframes() {
      const frameHR = document.getElementById('frameHR');
      const frameOps = document.getElementById('frameOps');
      frameHR.src = frameHR.src;
      frameOps.src = frameOps.src;
    }
  </script>

</body>
</html>
