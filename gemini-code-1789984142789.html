<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRMS Dashboard - Employee Onboarding</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-800 text-white flex flex-col justify-between p-4">
      <div>
        <div class="flex items-center gap-3 text-xl font-bold text-blue-400 mb-8 p-2">
          <i class="fa-solid fa-users-gear"></i>
          <span>Company HRMS</span>
        </div>
        <nav class="space-y-2">
          <a href="#" class="flex items-center gap-3 p-3 rounded-lg bg-blue-600 text-white font-medium">
            <i class="fa-solid fa-[#1e293b] fa-user-plus"></i> Onboarding & Team
          </a>
        </nav>
      </div>
      <div class="text-xs text-slate-400 text-center">
        &copy; 2026 HRMS System
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-8">
      
      <!-- Top Bar -->
      <div class="flex justify-between items-center mb-8">
        <div>
          <h1 class="text-2xl font-bold text-gray-800">Employee Onboarding Dashboard</h1>
          <p class="text-gray-500 text-sm">Naye employees ka data enter karein aur team manage karein.</p>
        </div>
      </div>

      <!-- Stats Grid -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex items-center gap-4">
          <div class="p-4 bg-blue-100 text-blue-600 rounded-lg text-2xl">
            <i class="fa-solid fa-users"></i>
          </div>
          <div>
            <p class="text-sm text-gray-500">Total Employees</p>
            <h3 id="totalCount" class="text-2xl font-bold text-gray-800">0</h3>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Onboarding Form -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
          <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2 flex items-center gap-2">
            <i class="fa-solid fa-user-plus text-blue-600"></i> New Employee Onboarding
          </h2>
          <form id="onboardingForm" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
              <input type="text" id="empName" required placeholder="Ex: Rahul Sharma" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
              <input type="email" id="empEmail" required placeholder="rahul@company.com" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Designation / Role</label>
              <input type="text" id="empRole" required placeholder="Ex: Software Engineer" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Department</label>
              <select id="empDept" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                <option value="IT / Tech">IT / Tech</option>
                <option value="HR">HR</option>
                <option value="Sales & Marketing">Sales & Marketing</option>
                <option value="Finance">Finance</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Joining Date</label>
              <input type="date" id="empDate" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition duration-200">
              Onboard Employee
            </button>
          </form>
        </div>

        <!-- Employee Table -->
        <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
          <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2 flex items-center gap-2">
            <i class="fa-solid fa-list text-blue-600"></i> Employee Directory
          </h2>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-gray-50 text-gray-600 text-xs uppercase tracking-wider">
                  <th class="p-3 border-b">Employee</th>
                  <th class="p-3 border-b">Department</th>
                  <th class="p-3 border-b">Joining Date</th>
                  <th class="p-3 border-b text-center">Action</th>
                </tr>
              </thead>
              <tbody id="employeeTableBody" class="divide-y divide-gray-100 text-sm text-gray-700">
                <!-- Data Javascript se yaha populate hoga -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- JavaScript Code -->
  <script>
    const onboardingForm = document.getElementById('onboardingForm');
    const employeeTableBody = document.getElementById('employeeTableBody');
    const totalCountEl = document.getElementById('totalCount');

    // LocalStorage se data load karna
    let employees = JSON.parse(localStorage.getItem('hrms_employees')) || [];

    // UI render function
    function renderEmployees() {
      employeeTableBody.innerHTML = '';
      
      if (employees.length === 0) {
        employeeTableBody.innerHTML = `
          <tr>
            <td colspan="4" class="text-center py-6 text-gray-400">Koi employee onboard nahi hua hai.</td>
          </tr>`;
      } else {
        employees.forEach((emp, index) => {
          const tr = document.createElement('tr');
          tr.className = "hover:bg-gray-50 transition";
          tr.innerHTML = `
            <td class="p-3">
              <div class="font-semibold text-gray-800">${emp.name}</div>
              <div class="text-xs text-gray-500">${emp.role} • ${emp.email}</div>
            </td>
            <td class="p-3">
              <span class="px-2 py-1 bg-blue-50 text-blue-700 text-xs font-medium rounded-full">${emp.dept}</span>
            </td>
            <td class="p-3 text-gray-600">${emp.date}</td>
            <td class="p-3 text-center">
              <button onclick="deleteEmployee(${index})" class="text-red-500 hover:text-red-700 p-1">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          `;
          employeeTableBody.appendChild(tr);
        });
      }

      totalCountEl.textContent = employees.length;
      localStorage.setItem('hrms_employees', JSON.stringify(employees));
    }

    // Form submit handle karna
    onboardingForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const newEmp = {
        name: document.getElementById('empName').value,
        email: document.getElementById('empEmail').value,
        role: document.getElementById('empRole').value,
        dept: document.getElementById('empDept').value,
        date: document.getElementById('empDate').value,
      };

      employees.push(newEmp);
      renderEmployees();
      onboardingForm.reset();
    });

    // Employee delete karne ka function
    function deleteEmployee(index) {
      if (confirm('Kya aap is employee ko remove karna chahte hain?')) {
        employees.splice(index, 1);
        renderEmployees();
      }
    }

    // Initial render
    renderEmployees();
  </script>

</body>
</html>
